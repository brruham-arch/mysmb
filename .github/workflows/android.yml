name: android
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install MoonBit
        run: |
          bash .github/install-moon.sh
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Migrate moon module
        run: bash .github/moon-prep.sh
      - name: Generate game C from ROM
        run: make codegen ROM=smb.nes
      - name: Show enemy loop
        run: bash .github/patch-extra.sh
      - name: ROM as app asset
        run: mkdir -p app/src/main/assets && cp smb.nes app/src/main/assets/smb.nes
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: smb-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: smb-code
          path: codegen/game/code.c
